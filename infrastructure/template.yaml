# AWS SAM Template for Smart Hospital Management System

Transform: AWS::Serverless-2016-10-31

Description: Smart Hospital Management System Infrastructure

Globals:
  Function:
    Timeout: 30
    Runtime: python3.9
    Handler: src/lambda_handler.handler
    Architectures:
      - x86_64

Parameters:
  EnvironmentName:
    Type: String
    Default: development

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, production]

Resources:
  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${EnvironmentName}-hospital-user-pool
      AutoVerifiedAttributes: ['email']
      UsernameAttributes: ['email']
      MfaConfiguration: OPTIONAL
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
        - Name: name
          AttributeDataType: String
          Required: true

  # Cognito Client
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub ${EnvironmentName}-hospital-client
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      SupportedIdentityProviders:
        - COGNITO

  PatientGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: patient
      UserPoolId: !Ref CognitoUserPool
  DoctorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: doctor
      UserPoolId: !Ref CognitoUserPool
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref CognitoUserPool

  # DynamoDB Tables
  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-patients
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: patientId
          AttributeType: S
      KeySchema:
        - AttributeName: patientId
          KeyType: HASH

  DoctorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-doctors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doctorId
          AttributeType: S
      KeySchema:
        - AttributeName: doctorId
          KeyType: HASH

  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-appointments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: appointmentId
          AttributeType: S
      KeySchema:
        - AttributeName: appointmentId
          KeyType: HASH

  AppointmentSlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-appointment-slots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotKey
          AttributeType: S
      KeySchema:
        - AttributeName: slotKey
          KeyType: HASH

  MedicalRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-medical-records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: recordId
          KeyType: HASH

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH

  # API Gateway
  HospitalApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      Auth:
        DefaultAuthorizationType: COGNITO_USER_POOLS
        CognitoUserPools:
          - !Ref CognitoUserPool

  # S3 Bucket for documents
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-hospital-documents
      ServerSideEncryptionConfiguration:
        Rule:
          ApplyServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

  # SNS Topic for notifications
  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-hospital-notifications

  # IAM Role for Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lambda-basic
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt PatientsTable.Arn
                  - !GetAtt DoctorsTable.Arn
                  - !GetAtt AppointmentsTable.Arn
                  - !GetAtt MedicalRecordsTable.Arn
                  - !GetAtt DocumentsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GeneratePresignedUrl
                Resource:
                  - !Sub arn:aws:s3:::${DocumentsBucket}/*
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref NotificationsTopic

  CreateAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/appointments/create/
      Handler: handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          APPOINTMENT_SLOTS_TABLE: !Ref AppointmentSlotsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSlotsTable
      Events:
        CreateAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments
            Method: post

  ListAppointmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/appointments/list/
      Handler: handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        ListAppointments:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments
            Method: get

  ApproveAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/appointments/approve/
      Handler: handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        ApproveAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}/approval
            Method: put

  # ── Appointments ──────────────────────────────────────────────────────────
  GetAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/appointments/get/
      Handler: handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        GetAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}
            Method: get

  CancelAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/appointments/cancel/
      Handler: handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        CancelAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}
            Method: delete

  RescheduleAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/appointments/reschedule/
      Handler: handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          APPOINTMENT_SLOTS_TABLE: !Ref AppointmentSlotsTable
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSlotsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        RescheduleAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}/reschedule
            Method: put

  # ── Patients ───────────────────────────────────────────────────────────────
  CreatePatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/patients/create/
      Handler: handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable
      Events:
        CreatePatient:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients
            Method: post

  GetPatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/patients/get/
      Handler: handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PatientsTable
      Events:
        GetPatient:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients/{patientId}
            Method: get

  ListPatientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/patients/list/
      Handler: handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PatientsTable
      Events:
        ListPatients:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients
            Method: get

  # ── Doctors ────────────────────────────────────────────────────────────────
  CreateDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/doctors/create/
      Handler: handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DoctorsTable
      Events:
        CreateDoctor:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors
            Method: post

  GetDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/doctors/get/
      Handler: handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DoctorsTable
      Events:
        GetDoctor:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}
            Method: get

  ListDoctorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/doctors/list/
      Handler: handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DoctorsTable
      Events:
        ListDoctors:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors
            Method: get

  # ── Medical Records ────────────────────────────────────────────────────────
  CreateMedicalRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/medical-records/create/
      Handler: handler.handler
      Environment:
        Variables:
          MEDICAL_RECORDS_TABLE: !Ref MedicalRecordsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MedicalRecordsTable
      Events:
        CreateMedicalRecord:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /medical-records
            Method: post

  GetMedicalRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/medical-records/get/
      Handler: handler.handler
      Environment:
        Variables:
          MEDICAL_RECORDS_TABLE: !Ref MedicalRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MedicalRecordsTable
      Events:
        GetMedicalRecord:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /medical-records/{recordId}
            Method: get

  ListMedicalRecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/medical-records/list/
      Handler: handler.handler
      Environment:
        Variables:
          MEDICAL_RECORDS_TABLE: !Ref MedicalRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MedicalRecordsTable
      Events:
        ListMedicalRecords:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /medical-records
            Method: get

  # ── Documents ──────────────────────────────────────────────────────────────
  GenerateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/documents/generate-upload-url/
      Handler: handler.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DocumentsBucket
      Events:
        GenerateUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/upload-url
            Method: post

  GenerateDownloadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/documents/generate-download-url/
      Handler: handler.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DocumentsBucket
      Events:
        GenerateDownloadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/download-url
            Method: get

  SaveDocumentMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/documents/save-metadata/
      Handler: handler.handler
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      Events:
        SaveDocumentMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/metadata
            Method: post

  DeleteDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/documents/delete/
      Handler: handler.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DocumentsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      Events:
        DeleteDocument:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/{documentId}
            Method: delete

  # ── Notifications ──────────────────────────────────────────────────────────
  SendNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notifications/
      Handler: handler.handler
      Environment:
        Variables:
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        SendNotification:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /notifications
            Method: post

  # ── AI Summary ─────────────────────────────────────────────────────────────
  AiSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/ai-summary/
      Handler: handler.handler
      Timeout: 60
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
                - arn:aws:bedrock:*::foundation-model/amazon.titan-text-express-v1
      Events:
        AiSummary:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /ai/summary
            Method: post

  # ── Missing CRUD Endpoints ─────────────────────────────────────────────────
  UpdatePatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/patients/update/
      Handler: handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable
      Events:
        UpdatePatient:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients/{patientId}
            Method: put

  UpdateDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/doctors/update/
      Handler: handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DoctorsTable
      Events:
        UpdateDoctor:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}
            Method: put

  GetDoctorAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/doctors/availability/get/
      Handler: handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DoctorsTable
      Events:
        GetDoctorAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}/availability
            Method: get

  SetDoctorAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/doctors/availability/set/
      Handler: handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DoctorsTable
      Events:
        SetDoctorAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}/availability
            Method: put

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HospitalApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/
  DocumentsBucket:
    Description: S3 bucket for medical documents
    Value: !Ref DocumentsBucket
  NotificationsTopicArn:
    Description: SNS topic ARN for notifications
    Value: !Ref NotificationsTopic
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient

# AWS SAM Template for Carely — Smart Hospital Management System
# Base project: https://github.com/Vickybulking/Smart_hospital (reworked)

Transform: AWS::Serverless-2016-10-31

Description: Carely Smart Hospital Management System — Cognito auth, API Gateway,
  Lambda, DynamoDB, S3 documents, SNS notifications

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    # Every function bundles the whole backend/ tree so `shared/` and
    # `functions/<domain>/<action>/handler.py` resolve inside the Lambda runtime.
    CodeUri: ../backend
    Architectures:
      - arm64

Parameters:
  EnvironmentName:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]

Resources:
  # ── Cognito ─────────────────────────────────────────────────────────────────
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${EnvironmentName}-carely-user-pool
      AutoVerifiedAttributes: ['email']
      UsernameAttributes: ['email']
      MfaConfiguration: "OFF"
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
        - Name: name
          AttributeDataType: String
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub ${EnvironmentName}-carely-client
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED

  PatientGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: patient
      UserPoolId: !Ref CognitoUserPool
  DoctorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: doctor
      UserPoolId: !Ref CognitoUserPool
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref CognitoUserPool

  # Self-registered sign-ups land in the patient group. Doctor and admin
  # accounts are provisioned by an operator (see scripts/seed_data.py) — a
  # client-chosen role would let anyone grant themselves admin.
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.auth.post_confirmation.handler.handler
      Description: Assigns new Cognito users to the patient group
      Policies:
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              # Wildcard pool ARN (account/region scoped) — referencing the pool
              # directly would create a circular dependency with LambdaConfig.
              Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  PostConfirmationInvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  # ── DynamoDB ────────────────────────────────────────────────────────────────
  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-carely-patients
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: patientId
          AttributeType: S
      KeySchema:
        - AttributeName: patientId
          KeyType: HASH

  DoctorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-carely-doctors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doctorId
          AttributeType: S
      KeySchema:
        - AttributeName: doctorId
          KeyType: HASH

  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-carely-appointments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: appointmentId
          AttributeType: S
      KeySchema:
        - AttributeName: appointmentId
          KeyType: HASH

  AppointmentSlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-carely-appointment-slots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotKey
          AttributeType: S
      KeySchema:
        - AttributeName: slotKey
          KeyType: HASH

  MedicalRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-carely-medical-records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: recordId
          KeyType: HASH

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-carely-documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH

  VoiceReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-carely-voice-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH

  # ── API Gateway (Cognito-authorised REST API) ──────────────────────────────
  HospitalApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
      # Cors must live HERE (not Globals.Api) — Globals-level Cors is ignored
      # when function events declare an explicit RestApiId, which left the
      # OPTIONS preflight behind the Cognito authorizer (401 on browsers).
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ── S3 / SNS ────────────────────────────────────────────────────────────────
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::AccountId}-${EnvironmentName}-carely-documents
      # Note: explicit ServerSideEncryptionConfiguration is omitted — all new S3
      # buckets get SSE-S3 (AES256) encryption by default, and the account's
      # CloudFormation early-validation hook rejects the property block.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']

  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-carely-notifications
      DisplayName: Carely Notifications

  # ── Appointments ────────────────────────────────────────────────────────────
  CreateAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.appointments.create.handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          APPOINTMENT_SLOTS_TABLE: !Ref AppointmentSlotsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSlotsTable
      Events:
        CreateAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments
            Method: post

  ListAppointmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.appointments.list.handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        ListAppointments:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments
            Method: get

  GetAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.appointments.get.handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        GetAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}
            Method: get

  ApproveAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.appointments.approve.handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        ApproveAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}/approval
            Method: put

  CancelAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.appointments.cancel.handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          APPOINTMENT_SLOTS_TABLE: !Ref AppointmentSlotsTable
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSlotsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        CancelAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}
            Method: delete

  RescheduleAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.appointments.reschedule.handler.handler
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          APPOINTMENT_SLOTS_TABLE: !Ref AppointmentSlotsTable
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSlotsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        RescheduleAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /appointments/{appointmentId}/reschedule
            Method: put

  # ── Patients ────────────────────────────────────────────────────────────────
  CreatePatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.patients.create.handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable
      Events:
        CreatePatient:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients
            Method: post

  GetPatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.patients.get.handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PatientsTable
      Events:
        GetPatient:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients/{patientId}
            Method: get

  ListPatientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.patients.list.handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PatientsTable
      Events:
        ListPatients:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients
            Method: get

  UpdatePatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.patients.update.handler.handler
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable
      Events:
        UpdatePatient:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /patients/{patientId}
            Method: put

  # ── Doctors ─────────────────────────────────────────────────────────────────
  CreateDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.doctors.create.handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DoctorsTable
      Events:
        CreateDoctor:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors
            Method: post

  GetDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.doctors.get.handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DoctorsTable
      Events:
        GetDoctor:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}
            Method: get

  ListDoctorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.doctors.list.handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DoctorsTable
      Events:
        ListDoctors:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors
            Method: get

  UpdateDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.doctors.update.handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DoctorsTable
      Events:
        UpdateDoctor:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}
            Method: put

  GetDoctorAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.doctors.availability.get.handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DoctorsTable
      Events:
        GetDoctorAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}/availability
            Method: get

  SetDoctorAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.doctors.availability.set.handler.handler
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DoctorsTable
      Events:
        SetDoctorAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /doctors/{doctorId}/availability
            Method: put

  # ── Medical Records ─────────────────────────────────────────────────────────
  CreateMedicalRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.medical_records.create.handler.handler
      Environment:
        Variables:
          MEDICAL_RECORDS_TABLE: !Ref MedicalRecordsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MedicalRecordsTable
      Events:
        CreateMedicalRecord:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /medical-records
            Method: post

  GetMedicalRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.medical_records.get.handler.handler
      Environment:
        Variables:
          MEDICAL_RECORDS_TABLE: !Ref MedicalRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MedicalRecordsTable
      Events:
        GetMedicalRecord:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /medical-records/{recordId}
            Method: get

  ListMedicalRecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.medical_records.list.handler.handler
      Environment:
        Variables:
          MEDICAL_RECORDS_TABLE: !Ref MedicalRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MedicalRecordsTable
      Events:
        ListMedicalRecords:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /medical-records
            Method: get

  # ── Documents (presigned S3 upload/download) ────────────────────────────────
  ListDocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.documents.list.handler.handler
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
      Events:
        ListDocuments:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents
            Method: get

  GenerateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.documents.generate_upload_url.handler.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DocumentsBucket
      Events:
        GenerateUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/upload-url
            Method: post

  GenerateDownloadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.documents.generate_download_url.handler.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DocumentsBucket
      Events:
        GenerateDownloadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/download-url
            Method: get

  SaveDocumentMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.documents.save_metadata.handler.handler
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      Events:
        SaveDocumentMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/metadata
            Method: post

  DeleteDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.documents.delete.handler.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DocumentsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      Events:
        DeleteDocument:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /documents/{documentId}
            Method: delete

  # ── Notifications ───────────────────────────────────────────────────────────
  SendNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.notifications.handler.handler
      Environment:
        Variables:
          NOTIFICATIONS_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        SendNotification:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /notifications
            Method: post

  # ── Voice-to-Medical-Report (Transcribe + Bedrock) ──────────────────────────
  VoiceUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.voice_reports.upload_url.handler.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DocumentsBucket
      Events:
        VoiceUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /voice-reports/upload-url
            Method: post

  CreateVoiceReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.voice_reports.create.handler.handler
      Timeout: 30
      Environment:
        Variables:
          VOICE_REPORTS_TABLE: !Ref VoiceReportsTable
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          TRANSCRIBE_LANGUAGE: en-IN
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VoiceReportsTable
        - S3ReadPolicy:
            BucketName: !Ref DocumentsBucket
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: '*'
      Events:
        CreateVoiceReport:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /voice-reports
            Method: post

  GetVoiceReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.voice_reports.get.handler.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          VOICE_REPORTS_TABLE: !Ref VoiceReportsTable
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          BEDROCK_MODEL_ID: apac.amazon.nova-lite-v1:0
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VoiceReportsTable
        - S3ReadPolicy:
            BucketName: !Ref DocumentsBucket
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:GetTranscriptionJob
              Resource: '*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:foundation-model/amazon.nova-*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/apac.*'
      Events:
        GetVoiceReport:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /voice-reports/{reportId}
            Method: get

  ListVoiceReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.voice_reports.list.handler.handler
      Environment:
        Variables:
          VOICE_REPORTS_TABLE: !Ref VoiceReportsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VoiceReportsTable
      Events:
        ListVoiceReports:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /voice-reports
            Method: get

  ApproveVoiceReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.voice_reports.approve.handler.handler
      Environment:
        Variables:
          VOICE_REPORTS_TABLE: !Ref VoiceReportsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VoiceReportsTable
      Events:
        ApproveVoiceReport:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /voice-reports/{reportId}/approval
            Method: put

  # ── AI Summary (Bedrock) ────────────────────────────────────────────────────
  AiSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.ai_summary.handler.handler
      Timeout: 60
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
                - arn:aws:bedrock:*::foundation-model/amazon.titan-text-express-v1
      Events:
        AiSummary:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalApi
            Path: /ai/summary
            Method: post

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HospitalApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  Region:
    Description: AWS region the stack is deployed in
    Value: !Ref AWS::Region
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
  DocumentsBucket:
    Description: S3 bucket for medical documents
    Value: !Ref DocumentsBucket
  NotificationsTopicArn:
    Description: SNS topic ARN for notifications
    Value: !Ref NotificationsTopic
